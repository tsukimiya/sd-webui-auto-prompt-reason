# sd-webui-auto-prompt-reason default configuration
default_provider: ollama
ollama:
  base_url: "http://localhost:11434"
  model: "qwen2.5:7b"
  timeout: 180
openai_compatible:
  base_url: "http://localhost:1234/v1"
  model: ""
  timeout: 180
gemini:
  base_url: "https://generativelanguage.googleapis.com/v1"
  model: "gemini-2.0-flash"
  timeout: 180
reasoning:
  effort: "medium"
  show_thinking: true
  max_reasoning_tokens: 8192
  max_completion_tokens: 2048
history:
  max_size: 50
ui:
  prompt_injection_mode: "append"
  default_system_prompt: >-
    You are an AI prompt word engineer. Use the provided keywords to create a
    beautiful composition. Only the prompt sentence are needed, not your
    feelings. Customize the style, scene, decoration, etc., and be as detailed
    as possible without endings.
